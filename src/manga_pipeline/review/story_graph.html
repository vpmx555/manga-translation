}
function renderTree(){

const es=s.events.filter(function(e){return matches(e,s);});if(!es.length)return;

html+='<li role="none">'+navButton('scene',s.id,'chapter',String(s.index+1).padStart(2,'0')+'  '+s.title,2,{expandable:true,open:open,attention:hasAttention,count:es.length});
if(open){html+='<ul role="group">';es.forEach(function(e){

html+='<li role="none">'+navButton('event',e.id,'scene:'+s.id,e.title,3,{expandable:true,open:eventOpen,attention:e.attention,reviewed:reviewed.has(e.id),count:e.rows.length});
if(eventOpen){html+='<ul role="group">';e.rows.forEach(function(r){html+='<li role="none">'+navButton('utterance',r.id,'event:'+e.id,shortText(r.text||'Untitled text',45),4,{attention:r.semantic.semantic_needs_review})+'</li>';});html+='</ul>';}html+='</li>';
});html+='</ul>';}html+='</li>';
});html+='</ul></li></ul>';

html+='<div class="map-content" style="zoom:'+state.zoom/100+'"><div class="root-column"><button class="root-card" data-action="map"><div class="root-icon">'+icon('book',17)+'</div><small>THE CHAPTER</small><h3>'+esc(chapterName)+'</h3><div class="root-footer">'+esc(chapterLabel)+'<br>'+D.scenes.length+' scenes · '+events.length+' events</div></button></div><div class="map-branches">';

es.forEach(function(e){html+='<button class="node event-node'+(e.attention?' attention':'')+(reviewed.has(e.id)?' is-reviewed':'')+'" data-action="event" data-id="'+esc(e.id)+'"><div class="node-kicker"><span>EVENT '+String(e.localIndex+1).padStart(2,'0')+'</span>'+statusPill(e)+'</div><h3>'+esc(e.title)+'</h3><div class="event-meta"><span>'+icon('chat',10)+' '+e.rows.length+' utterances</span><span>'+esc(pageRange(e))+'</span><span class="go">'+icon('chevron',12)+'</span></div></button>';});html+='</div></div>';
});html+='</div></div>';
}
html+='</div><div class="map-legend"><div class="legend-items"><span><i class="legend-dot"></i>Story branch</span><span><i class="legend-dot amber"></i>Needs attention</span><span><i class="legend-dot green"></i>Reviewed by you</span></div><span>'+visible.reduce(function(n,x){return n+x.events.length;},0)+' of '+events.length+' events in view</span></div></section><div class="bottom-note"><span>'+icon('lock',10)+' A review of saved results. Your source stays untouched.</span><span>CHAPTER → SCENE → EVENT → UTTERANCE</span></div>';return html;
}
function confidence(c){if(!c||!Object.keys(c).length)return '';return '<div class="confidence-list" aria-label="Model confidence">'+Object.entries(c).map(function(entry){const score=Number(entry[1]);return '<div class="confidence-item"><div class="confidence-caption"><span>'+esc(label(entry[0]))+'</span><b>'+esc(entry[1])+'/10</b></div><div class="confidence-track"><i class="'+(score<6?'low':'')+'" style="width:'+Math.min(100,Math.max(0,score*10))+'%"></i></div></div>';}).join('')+'</div>';}
function rawDetails(title,value){return '<details class="raw-details"><summary>'+esc(title)+'</summary><pre>'+esc(JSON.stringify(value,null,2))+'</pre></details>';}
function rowCard(r,index){
const a=r.semantic||{},hasSemantic=Object.keys(a).length>0,needs=a.semantic_needs_review||a.semantic_resolution==='unresolved'||(a.speaker_anchor&&a.speaker_anchor.person_id&&a.speaker_anchor.person_id!==a.speaker_person_id),speaker=a.speaker_person_id?person(a.speaker_person_id):label(a.speaker_kind),listener=(a.addressee_person_ids||[]).map(person).join(', ')||label(a.addressee_type);
let html='<section class="utterance-card'+(state.row===r.id?' selected':'')+'" data-utterance="'+esc(r.id)+'"><div class="utterance-top"><span class="sequence"><b>'+String(index+1).padStart(2,'0')+'</b>UTTERANCE</span><span>'+(r.page!=null?'PAGE '+esc(r.page):'SOURCE TEXT')+(r.panel_index!=null?' / PANEL '+(Number(r.panel_index)+1):'')+'</span></div><p class="source-quote">'+esc(r.text||'No source text recorded.')+'</p>';
if(hasSemantic){html+='<div class="semantic-chips">'+(needs?'<span class="pill amber">'+icon('alert',10)+'Needs review</span>':'')+(a.content_type?'<span class="pill">'+esc(label(a.content_type))+'</span>':'')+(a.speech_style?'<span class="pill">'+esc(label(a.speech_style))+'</span>':'')+(a.bubble_tail?'<span class="pill">'+(a.bubble_tail.has_tail?'MAGI tail linked':'No MAGI tail')+'</span>':'')+'</div><div class="decision-grid"><div class="decision"><div class="decision-label">'+icon('user',10)+'SPEAKER</div><div class="decision-name">'+esc(speaker)+'</div></div><div class="decision"><div class="decision-label">'+icon('chat',10)+'LISTENER</div><div class="decision-name">'+esc(listener)+'</div></div></div>';
if(a.speaker_anchor&&a.speaker_anchor.person_id&&a.speaker_anchor.person_id!==a.speaker_person_id)html+='<div class="anchor-note">'+icon('alert',11)+' Source anchor suggests '+esc(person(a.speaker_anchor.person_id))+'. Compare with the saved speaker decision.</div>';
html+=confidence(a.confidence);
if(a.evidence)html+='<details class="explanation"><summary>'+icon('chevron',10)+'Why this decision?</summary><p>'+esc(a.evidence)+'</p></details>';
if(a.mentions&&a.mentions.length)html+='<div class="mentions">'+a.mentions.map(function(m){return '<div class="mention"><strong>'+esc(label(m.mention_type))+'</strong> → '+esc(person(m.target_person_id))+'<br>'+esc(m.evidence||'')+'</div>';}).join('')+'</div>';
if(a.semantic_errors&&a.semantic_errors.length)html+='<div class="anchor-note">'+a.semantic_errors.map(esc).join('<br>')+'</div>';
}else html+='<span class="pill">Source text · semantic analysis pending</span>';
if(r.change)html+='<div class="change-card"><strong>'+icon('check',10)+'Updated in reanalyze</strong><br>'+esc(r.change.reason||'This decision was updated during chapter review.')+'</div>'+rawDetails('Compare changed fields',r.change.fields);
html+='<details class="explanation"><summary>'+icon('chevron',10)+'Source references</summary><p>'+esc(r.id)+'</p></details></section>';return html;
}
function evidencePanel(e){
let html='<aside class="evidence-panel"><div class="panel-title"><h3>'+icon('image',14)+'Source evidence</h3><span>'+e.pictures.length+' image'+(e.pictures.length===1?'':'s')+'</span></div>';
if(!e.pictures.length)return html+'<div class="empty-state">'+icon('image',25)+'<p>No retained image is linked to this event. Source text and saved decisions are still available.</p></div></aside>';
state.picture=Math.min(state.picture,e.pictures.length-1);const p=e.pictures[state.picture];
html+='<div class="evidence-image"><button data-action="image" aria-label="Enlarge source evidence"><img src="'+esc(p.file)+'" alt="'+esc('Retained evidence for '+e.title)+'" loading="lazy"></button><span class="image-zoom-hint">'+icon('zoom',13)+'</span></div><div class="image-caption"><span>'+esc((p.label||'').replace(/^.*:p(\d+)$/,'Page $1'))+' · '+(state.picture+1)+' / '+e.pictures.length+'</span><span class="image-pager"><button data-action="previous-image" '+(state.picture===0?'disabled':'')+' aria-label="Previous evidence image">'+icon('left',11)+'</button><button data-action="next-image" '+(state.picture===e.pictures.length-1?'disabled':'')+' aria-label="Next evidence image">'+icon('chevron',11)+'</button></span></div><div class="evidence-foot">Read the image labels alongside each saved decision. Model confidence is a self-reported score, not proof of correctness.</div></aside>';return html;
}
function readingView(){
const e=eventById.get(state.event);if(!e)return empty('There are no events available to review.');
const s=sceneById.get(e.sceneId),visible=visibleEvents(),idx=visible.indexOf(e),wasReviewed=reviewed.has(e.id);
let html=banner()+'<section class="reading-heading"><div><div class="eyebrow"><span class="live-dot"></span><button style="border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer" data-action="scene" data-id="'+esc(s.id)+'">SCENE '+String(s.index+1).padStart(2,'0')+'</button> / EVENT '+String(e.localIndex+1).padStart(2,'0')+'</div><h1>'+esc(e.title)+'</h1><p>'+esc(e.description)+'</p><div class="reading-meta">'+statusPill(e)+'<span class="pill">'+esc(pageRange(e))+'</span><span class="pill">'+e.rows.length+' utterances</span></div></div><button class="btn '+(wasReviewed?'reviewed':'primary')+'" data-action="review-toggle" aria-pressed="'+wasReviewed+'">'+icon('check',14)+(wasReviewed?'Reviewed':'Mark reviewed')+'</button></section>';
if(e.error)html+='<div class="issue-banner"><strong>'+icon('alert',12)+' This event needs attention.</strong><br>'+esc(e.error)+'<br>The saved failure is preserved. Marking an event reviewed does not resolve its pipeline error.</div>';
html+='<div class="section-bar"><div class="view-switch"><button data-action="map">'+icon('map',12)+'Story map</button><button class="active" data-action="reading">'+icon('book',12)+'Reading room</button></div><div class="reading-nav"><button class="btn icon-only" data-action="previous-event" '+(idx<=0?'disabled':'')+' aria-label="Previous event">'+icon('left',12)+'</button><span class="position">'+(idx+1)+' / '+visible.length+'</span><button class="btn icon-only" data-action="next-event" '+(idx<0||idx===visible.length-1?'disabled':'')+' aria-label="Next event">'+icon('chevron',12)+'</button></div></div><div class="reading-grid"><div class="dialogue-panel"><div class="tabs" role="tablist" aria-label="Event details">'+[['utterances','Utterances',e.rows.length],['changes','Changes',e.changeCount],['details','Details',null]].map(function(t){return '<button class="tab'+(state.tab===t[0]?' active':'')+'" role="tab" aria-selected="'+(state.tab===t[0])+'" data-action="tab" data-tab="'+t[0]+'">'+t[1]+(t[2]!==null?'<span>'+t[2]+'</span>':'')+'</button>';}).join('')+'</div>';
if(state.tab==='utterances')html+=e.rows.map(rowCard).join('');
else if(state.tab==='changes'){const changed=e.rows.filter(function(r){return r.change;});html+=changed.length?changed.map(rowCard).join(''):'<div class="empty-state">'+icon('check',26)+'<h3>No applied changes here.</h3><p>This event has no saved reanalyze corrections. Its original decisions remain visible in Utterances.</p></div>';}
else html+='<div style="padding:21px 23px"><div class="eyebrow">EVENT SUMMARY CONFIDENCE</div>'+confidence(typeof e.confidence==='number'?{description:e.confidence}:null)+'<p class="explanation">This view presents the saved result for '+esc(titleCase(D.stage))+'. It does not rerun the model or change the underlying chapter.</p></div>'+rawDetails('Event references',{event_id:e.id,scene_id:s.id,status:e.status,utterance_ids:e.rows.map(function(r){return r.id;})})+rawDetails('Scene context',{title:s.title,description:s.description,confidence:s.confidence})+(s.hypotheses.length?rawDetails('Historical graph hypotheses — provisional',s.hypotheses):'')+(D.rejected.length?rawDetails('Proposals not applied',D.rejected):'');
return html+'</div>'+evidencePanel(e)+'</div><div class="bottom-note"><span>'+icon('lock',10)+' Your review marks are personal. Saved pipeline decisions stay unchanged.</span><span>[ Previous event &nbsp; ] Next event &nbsp; / Search</span></div>';
}
function render(){renderHeader();renderTree();$('workspace').innerHTML=state.view==='reading'?readingView():mapView();if(state.row){const card=Array.from(document.querySelectorAll('[data-utterance]')).find(function(n){return n.dataset.utterance===state.row;});if(card)card.scrollIntoView({block:'center'});}}
function closeNav(){$('app').classList.remove('nav-open');}
function selectEvent(id,row){const e=eventById.get(id);if(!e)return;state.view='reading';state.event=id;state.scene=e.sceneId;state.row=row||null;state.picture=0;state.tab='utterances';state.openScenes.add(e.sceneId);state.openEvents.add(id);state.focusedNav=row?'utterance:'+row:'event:'+id;closeNav();render();$('workspace').scrollTop=0;if(row){const card=Array.from(document.querySelectorAll('[data-utterance]')).find(function(n){return n.dataset.utterance===row;});if(card)card.scrollIntoView({block:'center'});}}
function changeEvent(step){const list=visibleEvents(),index=list.findIndex(function(e){return e.id===state.event;}),next=list[index+step];if(next)selectEvent(next.id);}
function showImage(){const e=eventById.get(state.event),p=e&&e.pictures[state.picture];if(!p)return;$('dialog-image').src=p.file;$('dialog-image').alt='Source evidence · '+e.title;$('dialog-label').textContent=e.title+' · '+(state.picture+1)+' / '+e.pictures.length;$('dialog-body').classList.remove('expanded');$('fit-button').textContent='Actual size';$('image-dialog').showModal();}
document.addEventListener('click',function(event){
const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
const action=button.dataset.action,id=button.dataset.id;
if(action==='open-nav'){$('app').classList.add('nav-open');return;}if(action==='close-nav'){closeNav();return;}
if(action==='close-image'){$('image-dialog').close();return;}if(action==='fit-image'){const expanded=$('dialog-body').classList.toggle('expanded');$('fit-button').textContent=expanded?'Fit image':'Actual size';return;}
if(action==='image'){showImage();return;}
if(action==='map'||action==='chapter'){state.view='map';state.scene=null;state.event=null;state.row=null;state.focusedNav='chapter';closeNav();}
else if(action==='scene'){state.view='map';state.scene=id;state.event=null;state.row=null;state.openScenes.add(id);state.focusedNav='scene:'+id;closeNav();}
else if(action==='event'){selectEvent(id);return;}
else if(action==='utterance'){const e=events.find(function(e){return e.rows.some(function(r){return r.id===id;});});if(e)selectEvent(e.id,id);return;}
else if(action==='reading'){const e=eventById.get(state.event)||visibleEvents().find(function(e){return !reviewed.has(e.id);})||visibleEvents()[0];if(e)selectEvent(e.id);else toast('No events match the current filters.');return;}
else if(action==='toggle-scene'){if(state.openScenes.has(id))state.openScenes.delete(id);else state.openScenes.add(id);renderTree();return;}
else if(action==='toggle-event'){if(state.openEvents.has(id))state.openEvents.delete(id);else state.openEvents.add(id);renderTree();return;}
else if(action==='expand-tree'){D.scenes.forEach(function(s){state.openScenes.add(s.id);});renderTree();return;}
else if(action==='collapse-tree'){state.openScenes.clear();state.openEvents.clear();renderTree();return;}
else if(action==='filter'){state.filter=button.dataset.filter;state.view='map';state.event=null;state.scene=null;state.row=null;}
else if(action==='clear-filters'){state.filter='all';state.query='';$('search').value='';state.view='map';state.scene=null;state.event=null;state.row=null;}
else if(action==='zoom-in'||action==='zoom-out'){const scroll=$('map-scroll');const position=scroll?{x:scroll.scrollLeft,y:scroll.scrollTop}:null;state.zoom=Math.min(130,Math.max(65,state.zoom+(action==='zoom-in'?10:-10)));render();if(position&&$('map-scroll')){$('map-scroll').scrollLeft=position.x;$('map-scroll').scrollTop=position.y;}return;}
else if(action==='previous-event'){changeEvent(-1);return;}else if(action==='next-event'){changeEvent(1);return;}
else if(action==='review-toggle'){if(reviewed.has(state.event)){reviewed.delete(state.event);toast('Review mark removed.');}else{reviewed.add(state.event);toast('Event marked reviewed. Source results stay unchanged.');}persist();}
else if(action==='tab'){state.tab=button.dataset.tab;state.row=null;}
else if(action==='previous-image'||action==='next-image'){const e=eventById.get(state.event);state.picture=Math.max(0,Math.min(e.pictures.length-1,state.picture+(action==='next-image'?1:-1)));}
else return;
render();
});

$('tree-nav').addEventListener('focusin',function(event){const n=event.target.closest('[role=treeitem]');if(n){state.focusedNav=n.dataset.key;this.querySelectorAll('[role=treeitem]').forEach(function(b){b.tabIndex=b===n?0:-1;});}});
$('tree-nav').addEventListener('keydown',function(event){
const n=event.target.closest('[role=treeitem]');if(!n)return;const list=Array.from(this.querySelectorAll('[role=treeitem]')),index=list.indexOf(n),key=event.key;let target;
if(key==='ArrowDown')target=list[Math.min(list.length-1,index+1)];else if(key==='ArrowUp')target=list[Math.max(0,index-1)];else if(key==='Home')target=list[0];else if(key==='End')target=list[list.length-1];
else if(key==='ArrowRight'||key==='ArrowLeft'){
const kind=n.dataset.action,id=n.dataset.id,set=kind==='scene'?state.openScenes:kind==='event'?state.openEvents:null;
if(set&&key==='ArrowRight'&&!set.has(id)){set.add(id);renderTree();target=Array.from(this.querySelectorAll('[role=treeitem]')).find(function(b){return b.dataset.key===n.dataset.key;});}
else if(set&&key==='ArrowLeft'&&set.has(id)){set.delete(id);renderTree();target=Array.from(this.querySelectorAll('[role=treeitem]')).find(function(b){return b.dataset.key===n.dataset.key;});}
else target=key==='ArrowRight'?list[index+1]:list.find(function(b){return b.dataset.key===n.dataset.parent;});
}else return;
event.preventDefault();if(target)target.focus();
});
document.addEventListener('keydown',function(event){if(event.target.closest('input,textarea,select')||$('image-dialog').open)return;if(event.key==='/'){event.preventDefault();if(matchMedia('(max-width:720px)').matches)$('app').classList.add('nav-open');$('search').focus();}else if(event.key===']'&&state.event)changeEvent(1);else if(event.key==='['&&state.event)changeEvent(-1);else if(event.key==='Escape')closeNav();});
$('image-dialog').addEventListener('click',function(event){if(event.target===this)this.close();});
$('brand-icon').innerHTML=icon('map',21);$('book-icon').innerHTML=icon('book',17);$('chapter-chevron').innerHTML=icon('down',13);$('search-icon').innerHTML=icon('search',15);$('expand-icon').innerHTML=icon('expand',12);$('collapse-icon').innerHTML=icon('collapse',12);$('menu-icon').innerHTML=icon('menu',20);$('dialog-close').innerHTML=icon('close',14);
render();
})();
</script>
</body>
</html>
